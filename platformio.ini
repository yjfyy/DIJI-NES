; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3-n16r8]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = lovyan03/LovyanGFX@^1.2.7
board_build.filesystem = fatfs
//board_build.embed_files = 
    data/超级马里奥中文.nes
    data/坦克大战中文.nes
    data/魂斗罗.NES
    data/双截龙2中文.nes
    data/双截龙3中文.nes
    data/松鼠大战.nes
    data/松鼠大战2.nes
    data/脱狱中文.nes
    data/脱狱2.nes
    data/赤色要塞美版.nes
    data/赤影战士中文.nes
    data/古巴战士.nes
    data/绿色兵团中文.nes
    data/冒险岛中文.nes
    data/忍者龙剑传日版.nes
    data/忍者龙剑传2日版.nes
    data/沙罗曼蛇1.nes
    data/激龟快打.nes
    data/激龟忍者传2.nes
    data/激龟忍者传3.nes
    data/筋肉人摔角大赛.nes
    data/快打旋风.nes
    data/联合大作战.NES
    data/马里奥医生.nes
    data/马戏团.nes
    data/鸟人战队.nes
    data/怒3.NES
    data/七宝奇谋2.NES
    data/热血足球2.nes
    data/双截龙1.nes
    data/五子棋.nes
    data/宇宙巡航机.nes
    data/越野摩托.nes
    data/中国象棋.nes
    data/最终任务日版.nes
    data/叮当.nes
    data/花式撞球美板.NES
    data/荒野大镖客中文NES
    data/魂斗罗2中文.nes
    data/魂斗罗力量.nes
    data/火之鸟凤凰篇.nes
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = minimal_16MB.csv
board_build.extra_flags = -DBOARD_HAS_PSRAM -DDISABLE_ALL_LIBRARY_WARNINGS
monitor_speed = 115200
upload_speed = 921600

; 激进优化 (参考 Anemoia-ESP32)
build_unflags = -Os -O2
build_flags = 
    -Ofast
    -funroll-loops
    -fstrict-aliasing
    -fno-exceptions
    -fno-rtti
    -ffunction-sections
    -fdata-sections
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

build_src_filter = +<*.cpp> +<*.ino> +<*.h> -<.git/> -<.pio/> -<.DS_Store>
